version: '3.8'

services:
  # Base de datos PostgreSQL con pgvector para embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-reviewer-postgres
    environment:
      POSTGRES_DB: agent_reviewer
      POSTGRES_USER: agent_reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_reviewer -d agent_reviewer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-reviewer-network

  # Redis para caché y colas de tareas
  redis:
    image: redis:7-alpine
    container_name: agent-reviewer-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-reviewer-network

  # Backend API (FastAPI + LangGraph + Agents)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-reviewer-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://agent_reviewer:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/agent_reviewer
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/github
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - ./backend:/app
      - ./backend/tmp:/tmp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - agent-reviewer-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Worker para tareas en background (Celery/RQ)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: agent-reviewer-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://agent_reviewer:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/agent_reviewer
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - ./backend/tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-reviewer-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Ollama para modelos locales (opcional)
  ollama:
    image: ollama/ollama:latest
    container_name: agent-reviewer-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/models
    volumes:
      - ollama_models:/models
    ports:
      - "11434:11434"
    networks:
      - agent-reviewer-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    profiles:
      - ollama

  # n8n para orquestación de workflows CI/CD
  n8n:
    image: n8nio/n8n:latest
    container_name: agent-reviewer-n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=agent_reviewer
      - DB_POSTGRESDB_USER=agent_reviewer
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-secure_password_change_me}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-secure_password_change_me}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-reviewer-network

  # Frontend (React + Vite + Tailwind)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-reviewer-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - VITE_N8N_WEBHOOK_URL=http://localhost:5678/webhook
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - agent-reviewer-network

  # Nginx como reverse proxy (producción)
  nginx:
    image: nginx:alpine
    container_name: agent-reviewer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - n8n
    networks:
      - agent-reviewer-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  n8n_data:

networks:
  agent-reviewer-network:
    driver: bridge